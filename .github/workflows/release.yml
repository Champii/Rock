name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (vMAJOR.MINOR.PATCH)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Install LLVM 18 and linker
        run: sudo apt-get update && sudo apt-get install -y llvm-18-dev libpolly-18-dev libllvm18 build-essential
      - name: Test and package
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          LLVM_SYS_180_PREFIX: /usr/lib/llvm-18
        run: |
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$(git rev-parse HEAD)"
          cargo test --locked -p rockup
          sh scripts/tests/install.sh
          bash scripts/release.sh "$RELEASE_TAG"
          bash scripts/tests/release.sh "dist/$RELEASE_TAG"
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/${{ inputs.tag || github.ref_name }}/*
          if-no-files-found: error

  draft:
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: assets
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" assets/* --repo Champii/Rock --verify-tag --draft \
            --title "Rock $RELEASE_TAG" --generate-notes \
            --notes 'Linux x86_64 GNU only. Requires glibc 2.39+, LLVM 18 shared libraries, and a C linker (Ubuntu 24.04: apt install libllvm18 build-essential curl ca-certificates). Install with the attached install.sh. Experimental release; review before publishing.'
