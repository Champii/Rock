[book]
title = "The Rock Programming Language"
authors = ["The Rock Project Contributors"]
description = "A practical, beginner-friendly guide to the Rock programming language"
language = "en"
src = "src"

[build]
build-dir = "book"
create-missing = false

[output.html]
default-theme = "navy"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/Champii/rock"
edit-url-template = "https://github.com/Champii/rock/edit/develop/docs/{path}"
site-url = "/rock/"
additional-css = ["theme/rock.css"]
additional-js = ["theme/rock-highlight.js"]

[output.html.fold]
enable = true
level = 1

[output.html.search]
enable = true
limit-results = 30
use-boolean-and = true
boost-title = 2
boost-hierarchy = 1
boost-paragraph = 1
expand = true
heading-split-level = 3
